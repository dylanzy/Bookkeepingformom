<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#dc643c">
<title>妈妈的记账本</title>

<!-- 图标 (iOS Safari 加桌面会用这个) -->
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f5f0;
    color: #2c2c2a;
    font-size: 17px;
    line-height: 1.5;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    max-width: 480px; margin: 0 auto;
    background: #f7f5f0;
  }
  .header {
    padding: 20px 22px 18px; background: #2c2c2a; color: #f7f5f0; flex-shrink: 0;
  }
  .header .label { font-size: 14px; opacity: 0.65; margin: 0 0 4px; }
  .header .total { font-size: 36px; font-weight: 500; margin: 0; letter-spacing: -0.5px; }
  .header .sub { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; opacity: 0.75; }
  .header .sub b { font-weight: 500; opacity: 1; color: #fff; }

  .tabs { display: flex; background: #fff; border-bottom: 0.5px solid #e0ddd4; flex-shrink: 0; }
  .tab {
    flex: 1; text-align: center; padding: 14px 0; font-size: 15px;
    color: #888780; border: none; background: none; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tab.active { color: #2c2c2a; border-bottom-color: #2c2c2a; font-weight: 500; }

  .list-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; }
  .day-header {
    display: flex; justify-content: space-between;
    padding: 12px 22px 6px; font-size: 12px; color: #888780;
    background: #f7f5f0; position: sticky; top: 0; z-index: 1;
    border-top: 0.5px solid #e0ddd4; border-bottom: 0.5px solid #e0ddd4;
  }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px; border-bottom: 0.5px solid #f0ede5; cursor: pointer;
  }
  .item:active { background: #f7f5f0; }
  .cat-tag {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    flex-shrink: 0; font-weight: 500;
  }
  .item-text { flex: 1; min-width: 0; }
  .item-text .raw {
    font-size: 15px; color: #2c2c2a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0;
  }
  .item-text .time { font-size: 12px; color: #888780; margin: 2px 0 0; }
  .item-amount { font-size: 18px; font-weight: 500; color: #2c2c2a; flex-shrink: 0; }

  .empty { text-align: center; color: #b4b2a9; font-size: 14px; padding: 60px 20px; }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }

  .footer {
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    background: #fff; border-top: 0.5px solid #e0ddd4; flex-shrink: 0;
  }
  .hint {
    text-align: center; font-size: 13px; color: #888780;
    margin: 0 0 10px; min-height: 18px; transition: color 0.2s;
  }
  .hint.error { color: #c0392b; }
  .hint.success { color: #1d9e75; }
  .hint.recording { color: #c0392b; font-weight: 500; }

  .mic-row { display: flex; gap: 10px; align-items: stretch; }
  .mic-btn {
    flex: 1; height: 60px; border-radius: 30px;
    background: #2c2c2a; color: #fff; border: none;
    font-size: 17px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.15s; font-family: inherit;
  }
  .mic-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .mic-btn.recording {
    background: #c0392b; transform: scale(1.02);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .query-btn {
    width: 60px; height: 60px; border-radius: 30px;
    background: #fff; border: 1.5px solid #2c2c2a;
    color: #2c2c2a; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: inherit; flex-shrink: 0;
    padding: 0;
  }
  .query-btn .label { font-size: 11px; margin-top: 1px; }
  .query-btn:disabled { opacity: 0.5; }
  .query-btn.recording {
    background: #2c2c2a; color: #fff;
    animation: pulse-blue 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(192, 57, 43, 0); }
  }
  @keyframes pulse-blue {
    0%, 100% { box-shadow: 0 0 0 0 rgba(44, 44, 42, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(44, 44, 42, 0); }
  }
  .mic-icon { width: 22px; height: 22px; display: inline-block; }

  .toolbar {
    display: flex; gap: 8px; padding: 12px 22px;
    background: #fff; border-bottom: 0.5px solid #f0ede5;
  }
  .toolbar button {
    padding: 8px 14px; font-size: 13px; background: #f7f5f0;
    border: 0.5px solid #e0ddd4; border-radius: 8px; cursor: pointer;
    color: #444441; font-family: inherit;
  }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 100%; max-width: 480px; margin: 0 auto;
    background: #fff; border-radius: 20px 20px 0 0;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
    animation: slideUp 0.25s ease-out;
    max-height: 85vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { margin: 0 0 16px; font-size: 18px; font-weight: 500; }
  .modal .heard {
    background: #f7f5f0; padding: 12px 14px; border-radius: 10px;
    font-size: 14px; color: #444441; margin-bottom: 14px;
  }
  .modal .heard span { color: #888780; }
  .modal label { display: block; font-size: 13px; color: #888780; margin: 12px 0 6px; }
  .modal input, .modal select {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 0.5px solid #d3d1c7; border-radius: 10px; background: #fff;
    font-family: inherit; color: #2c2c2a;
  }
  .modal input:focus, .modal select:focus { outline: 2px solid #2c2c2a; outline-offset: -2px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btns button {
    flex: 1; padding: 14px; font-size: 16px; border-radius: 12px;
    border: none; cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .btn-primary { background: #2c2c2a; color: #fff; }
  .btn-secondary { background: #f0ede5; color: #2c2c2a; }
  .btn-danger { background: #fff; color: #c0392b; border: 0.5px solid #e0ddd4 !important; }

  .stat-tabs {
    display: flex; gap: 6px; padding: 10px 16px;
    background: #fff; border-bottom: 0.5px solid #f0ede5;
    overflow-x: auto;
  }
  .stat-tab {
    padding: 6px 16px; font-size: 14px;
    background: #f7f5f0; border: 0.5px solid #e0ddd4;
    border-radius: 999px; cursor: pointer; flex-shrink: 0;
    color: #5f5e5a; font-family: inherit; min-width: 50px;
  }
  .stat-tab.active { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }

  .period-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px; background: #fff;
    border-bottom: 0.5px solid #f0ede5;
  }
  .period-nav button {
    width: 36px; height: 36px; border-radius: 18px;
    background: #f7f5f0; border: none; cursor: pointer;
    font-size: 18px; color: #5f5e5a;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .period-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
  .period-nav .label {
    font-size: 15px; font-weight: 500; color: #2c2c2a;
  }

  .stat-content { padding: 16px 22px; }
  .stat-card {
    background: #f7f5f0; border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .stat-card .name { font-size: 13px; color: #888780; margin: 0 0 4px; }
  .stat-card .val { font-size: 28px; font-weight: 500; margin: 0; }
  .stat-card .delta { font-size: 12px; margin-top: 6px; }
  .stat-card .delta.up { color: #c0392b; }
  .stat-card .delta.down { color: #1d9e75; }
  .stat-card-row { display: flex; gap: 10px; }
  .stat-card-row .stat-card { flex: 1; }
  .stat-card-row .stat-card .val { font-size: 22px; }

  .cat-stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 0.5px solid #f0ede5;
  }
  .cat-stat-row:last-child { border-bottom: none; }
  .cat-stat-bar {
    flex: 1; height: 6px; background: #f0ede5;
    border-radius: 3px; margin: 0 12px; overflow: hidden;
  }
  .cat-stat-bar > div { height: 100%; transition: width 0.3s; }

  .section-title {
    margin: 22px 0 8px; font-size: 14px; color:#5f5e5a;
    font-weight: 500;
  }

  .answer-big {
    background: #2c2c2a; color: #fff;
    border-radius: 12px; padding: 20px;
    text-align: center; margin: 8px 0 16px;
  }
  .answer-big .a-label { font-size: 13px; opacity: 0.7; margin: 0; }
  .answer-big .a-val { font-size: 36px; font-weight: 500; margin: 4px 0 0; }
  .answer-big .a-sub { font-size: 12px; opacity: 0.6; margin-top: 4px; }
  .answer-list {
    max-height: 280px; overflow-y: auto;
    border-top: 0.5px solid #f0ede5;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <p class="label">本月已花</p>
    <p class="total" id="month-total">¥ 0.00</p>
    <div class="sub">
      <span>今日 <b id="today-total">¥0</b></span>
      <span>共 <b id="record-count">0</b> 笔</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="list">明细</button>
    <button class="tab" data-tab="stat">统计</button>
  </div>

  <div class="list-wrap" id="view-list">
    <div class="toolbar">
      <button onclick="openAddModal()">手动添加</button>
      <button onclick="exportData()">导出 Excel</button>
      <button onclick="confirmClear()" style="margin-left: auto; color: #c0392b;">清空</button>
    </div>
    <div id="list-content"></div>
  </div>

  <div class="list-wrap" id="view-stat" style="display:none;">
    <div class="stat-tabs" id="stat-tabs">
      <button class="stat-tab active" data-period="day">日</button>
      <button class="stat-tab" data-period="week">周</button>
      <button class="stat-tab" data-period="month">月</button>
      <button class="stat-tab" data-period="quarter">季</button>
      <button class="stat-tab" data-period="year">年</button>
    </div>
    <div class="period-nav">
      <button id="period-prev" aria-label="上一个">‹</button>
      <span class="label" id="period-label"></span>
      <button id="period-next" aria-label="下一个">›</button>
    </div>
    <div class="stat-content" id="stat-content"></div>
  </div>

  <div class="footer">
    <p class="hint" id="hint">按住"按住说话"记账,点"查一查"查询</p>
    <div class="mic-row">
      <button class="mic-btn" id="mic-btn">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span id="btn-text">按住说话</span>
      </button>
      <button class="query-btn" id="query-btn" aria-label="查一查">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="label">查一查</span>
      </button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <h3 id="modal-title">添加一笔</h3>
    <div class="heard" id="m-heard" style="display:none;">
      <span>听到的:</span><span id="m-heard-text" style="color:#2c2c2a;"></span>
    </div>
    <label>金额(元)</label>
    <input type="number" inputmode="decimal" step="0.01" id="m-amount" placeholder="0.00">
    <label>分类</label>
    <select id="m-cat">
      <option value="买菜">买菜</option>
      <option value="餐饮">餐饮</option>
      <option value="交通">交通</option>
      <option value="医疗">医疗</option>
      <option value="日用">日用</option>
      <option value="水电煤">水电煤</option>
      <option value="人情">人情</option>
      <option value="家人">家人(孙辈)</option>
      <option value="儿女">儿女</option>
      <option value="衣服">衣服</option>
      <option value="娱乐">娱乐</option>
      <option value="学习">学习</option>
      <option value="还款">还款</option>
      <option value="其他">其他</option>
    </select>
    <label>备注</label>
    <input type="text" id="m-note" placeholder="(可选)">
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-danger" id="m-delete" style="display:none;" onclick="deleteRecord()">删除</button>
      <button class="btn-primary" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="answer-modal">
  <div class="modal">
    <h3 id="ans-title">查询结果</h3>
    <div class="heard" id="ans-heard">
      <span>问的是:</span><span id="ans-heard-text" style="color:#2c2c2a;"></span>
    </div>
    <div id="ans-content"></div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="closeAnswerModal()" style="flex:1;">知道了</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'mom_accounting_v1';
const LEARNED_KEY = 'mom_accounting_learned_v1';
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let learned = JSON.parse(localStorage.getItem(LEARNED_KEY) || '{}');
let editingId = null;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  localStorage.setItem(LEARNED_KEY, JSON.stringify(learned));
}

const CAT_KEYWORDS = {
  '买菜':  [
    // 动词
    '买菜','买的菜','买点菜','菜市场','超市','农贸市场','水果店',
    // 蔬菜类
    '蔬菜','青菜','白菜','大白菜','小白菜','西红柿','番茄','土豆','马铃薯','洋葱','大葱','小葱','韭菜','黄瓜','茄子','萝卜','胡萝卜','白萝卜','冬瓜','南瓜','丝瓜','苦瓜','豆角','豇豆','四季豆','毛豆','豌豆','芹菜','菠菜','油菜','生菜','空心菜','茼蒿','香菜','辣椒','青椒','尖椒','蘑菇','香菇','金针菇','平菇','木耳','银耳','豆腐','豆皮','腐竹','藕','莲藕','山药','玉米','红薯','地瓜','生姜','大蒜','蒜苗',
    // 肉禽蛋
    '猪肉','牛肉','羊肉','鸡肉','鸭肉','排骨','五花肉','瘦肉','肉馅','香肠','腊肉','培根','鸡腿','鸡翅','整鸡','鸡蛋','鸭蛋','鹌鹑蛋','咸鸭蛋',
    // 水产
    '虾','螃蟹','带鱼','鲫鱼','鲈鱼','黄花鱼','三文鱼','鱿鱼','章鱼','蛤蜊','花甲','扇贝','活鱼',
    // 水果
    '水果','苹果','香蕉','橘子','橙子','柚子','葡萄','西瓜','哈密瓜','甜瓜','桃子','水蜜桃','樱桃','车厘子','草莓','蓝莓','榴莲','芒果','菠萝','凤梨','火龙果','猕猴桃','奇异果','柿子','李子','石榴','椰子','柠檬','百香果','山竹','龙眼','荔枝','红枣',
    // 主食杂粮
    '大米','小米','面粉','五谷杂粮','粗粮','燕麦','薏米','黑豆','红豆','绿豆','黄豆','花生','瓜子','核桃','开心果','腰果','杏仁',
    // 调味品 / 油盐
    '食用油','花生油','菜籽油','酱油','陈醋','料酒','味精','鸡精','蚝油','八角','花椒','干辣椒','胡椒粉','五香粉','咖喱',
    // 奶
    '牛奶','酸奶','奶粉'
  ],
  '餐饮':  ['吃饭','吃了','早餐','午餐','晚餐','早点','豆浆','油条','包子','馒头','面条','米饭','饺子','馄饨','下馆子','外卖','奶茶','咖啡','饭店','餐厅','请客','聚餐'],
  '交通':  ['打车','出租','滴滴','地铁','公交','公车','车票','火车','高铁','飞机','机票','油费','加油','停车','停车费','过路费'],
  '医疗':  ['医院','看病','挂号','买药','药','药店','体检','检查','针','针剂','输液','打针','化验','理疗'],
  '水电煤': ['水费','电费','燃气','煤气','天然气','物业','物业费','取暖费','网费','宽带','话费','手机费'],
  '人情':  ['随礼','份子钱','份子','红包','礼金','送礼','喜事','满月','婚礼','寿宴'],
  '家人':  ['孙子','孙女','外孙','小孙','宝宝','给孩子','给小孙','给孙','给外孙'],
  '儿女':  ['儿子','女儿','闺女','小子','给儿子','给女儿','给闺女','打给','转给孩子','补贴'],
  '衣服':  ['衣服','裤子','鞋子','袜子','帽子','围巾','内衣','外套','毛衣'],
  '日用':  ['洗衣粉','洗洁精','纸巾','卫生纸','牙膏','牙刷','洗发水','沐浴露','日用品','百货','五金','家具'],
  '娱乐':  ['看电影','电影','旅游','旅行','按摩','美容','美发','理发','剪头','打麻将','保健'],
  '学习':  ['老年大学','上课','学费','培训','报班','兴趣班','书本','买书','字帖','教材'],
  '还款':  ['还款','还钱','房贷','车贷','信用卡','花呗','借呗','网贷','房租','贷款','还月供','月供','分期'],
};
const CAT_ORDER = Object.keys(CAT_KEYWORDS);

function classify(text) {
  for (const kw in learned) if (text.includes(kw)) return learned[kw];
  // 优先级 1: "给谁"的语义最强 (孙辈/儿女)
  for (const cat of ['家人', '儿女']) {
    for (const kw of CAT_KEYWORDS[cat]) if (text.includes(kw)) return cat;
  }
  // 优先级 2: 用分类名本身匹配 (比如直接说"水电煤"、"还款")
  for (const cat of CAT_ORDER) {
    if (text.includes(cat)) return cat;
  }
  // 优先级 3: 关键词匹配
  for (const cat of CAT_ORDER) {
    for (const kw of CAT_KEYWORDS[cat]) if (text.includes(kw)) return cat;
  }
  return '其他';
}

const CN_NUM = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
const CN_UNIT = {'十':10,'百':100,'千':1000};

function parseChineseNumber(s) {
  let total = 0, current = 0;
  for (const ch of s) {
    if (CN_NUM[ch] !== undefined) current = CN_NUM[ch];
    else if (CN_UNIT[ch] !== undefined) {
      const u = CN_UNIT[ch];
      if (current === 0) current = 1;
      total += current * u;
      current = 0;
    }
  }
  total += current;
  return total > 0 ? total : null;
}

function extractAmount(text) {
  let m;
  m = text.match(/(\d+)\s*[块元]\s*(\d+)\s*[毛角]?/);
  if (m) return parseFloat(m[1]) + parseFloat(m[2]) / 10;
  m = text.match(/(\d+\.?\d*)\s*[块元]?/);
  if (m && m[1] && parseFloat(m[1]) > 0) return parseFloat(m[1]);
  m = text.match(/([零一二两三四五六七八九十百千]+)\s*[块元]/);
  if (m) {
    const n = parseChineseNumber(m[1]);
    if (n) return n;
  }
  return null;
}

let audioContext = null;
let mediaStream = null;
let processor = null;
let recordedSamples = [];
let isRecording = false;

async function startRecording() {
  if (isRecording) return;
  recordedSamples = [];
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('此浏览器不支持录音');
  }
  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
  });
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === 'suspended') await audioContext.resume();
  const source = audioContext.createMediaStreamSource(mediaStream);
  processor = audioContext.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    const ch = e.inputBuffer.getChannelData(0);
    recordedSamples.push(new Float32Array(ch));
  };
  source.connect(processor);
  processor.connect(audioContext.destination);
  isRecording = true;
}

async function stopRecording() {
  if (!isRecording) return null;
  isRecording = false;
  try { processor.disconnect(); } catch (e) {}
  try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
  const sampleRate = audioContext.sampleRate;
  let totalLen = 0;
  for (const c of recordedSamples) totalLen += c.length;
  const merged = new Float32Array(totalLen);
  let off = 0;
  for (const c of recordedSamples) { merged.set(c, off); off += c.length; }
  const resampled = resample(merged, sampleRate, 16000);
  const pcm = floatTo16BitPCM(resampled);
  try { await audioContext.close(); } catch (e) {}
  audioContext = null;
  return arrayBufferToBase64(pcm.buffer);
}

function resample(input, fromRate, toRate) {
  if (fromRate === toRate) return input;
  const ratio = fromRate / toRate;
  const newLen = Math.floor(input.length / ratio);
  const out = new Float32Array(newLen);
  for (let i = 0; i < newLen; i++) {
    const idx = i * ratio;
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, input.length - 1);
    const frac = idx - i0;
    out[i] = input[i0] * (1 - frac) + input[i1] * frac;
  }
  return out;
}

function floatTo16BitPCM(input) {
  const out = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}

function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

async function recognizeAudio(audioBase64) {
  const resp = await fetch('/.netlify/functions/asr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ audio: audioBase64 }),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || '识别失败');
  return data.text || '';
}

// 调智谱做分类或查询解析
async function callAI(mode, text) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try {
    const resp = await fetch('/.netlify/functions/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, text }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'AI 调用失败');
    return data;
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

function setupMicButton(buttonEl, btnTextEl, hintEl, mode) {
  let active = false;
  const defaultText = mode === 'record' ? '按住说话' : null;

  async function press(e) {
    if (e) e.preventDefault();
    if (active) return;
    active = true;
    hintEl.classList.remove('error', 'success');
    hintEl.classList.add('recording');
    hintEl.textContent = mode === 'record' ? '正在录音... 松开结束' : '正在听问题... 松开结束';
    buttonEl.classList.add('recording');
    if (btnTextEl) btnTextEl.textContent = '正在听...';
    try {
      await startRecording();
    } catch (err) {
      active = false;
      buttonEl.classList.remove('recording');
      if (btnTextEl) btnTextEl.textContent = defaultText;
      hintEl.classList.remove('recording');
      hintEl.classList.add('error');
      if (err.name === 'NotAllowedError') hintEl.textContent = '需要允许使用麦克风';
      else hintEl.textContent = '录音失败:' + err.message;
    }
  }

  async function release(e) {
    if (e) e.preventDefault();
    if (!active) return;
    active = false;
    buttonEl.classList.remove('recording');
    buttonEl.disabled = true;
    if (btnTextEl) btnTextEl.textContent = '识别中...';
    hintEl.classList.remove('recording');
    hintEl.textContent = '正在识别,请稍候...';

    try {
      const audioB64 = await stopRecording();
      if (!audioB64) throw new Error('没录到声音');
      const text = await recognizeAudio(audioB64);
      buttonEl.disabled = false;
      if (btnTextEl) btnTextEl.textContent = defaultText;
      if (!text || !text.trim()) {
        hintEl.classList.add('error');
        hintEl.textContent = '没听清,请大声再说一次';
        return;
      }
      if (mode === 'record') handleRecognizedText(text);
      else handleQueryText(text);
    } catch (err) {
      buttonEl.disabled = false;
      if (btnTextEl) btnTextEl.textContent = defaultText;
      hintEl.classList.add('error');
      hintEl.textContent = '识别失败:' + err.message;
    }
  }

  buttonEl.addEventListener('touchstart', press, { passive: false });
  buttonEl.addEventListener('touchend', release, { passive: false });
  buttonEl.addEventListener('touchcancel', release, { passive: false });
  buttonEl.addEventListener('mousedown', press);
  buttonEl.addEventListener('mouseup', release);
  buttonEl.addEventListener('mouseleave', (e) => { if (active) release(e); });
}

async function handleRecognizedText(text) {
  const cleaned = text.replace(/[。,!?、\s]+$/g, '').trim();

  // 先用本地规则
  let amount = extractAmount(cleaned);
  let cat = classify(cleaned);
  let note = cleaned;
  let aiUsed = false;

  // 如果本地规则不够好(归到"其他" 或 没识别到金额), 调 AI 兜底
  const needAI = (cat === '其他') || (!amount);
  if (needAI) {
    document.getElementById('hint').textContent = '正在智能分类...';
    try {
      const ai = await callAI('classify', cleaned);
      aiUsed = true;
      if (ai.cat) cat = ai.cat;
      if (ai.amount && ai.amount > 0 && !amount) amount = ai.amount;
      if (ai.note) note = ai.note;
    } catch (err) {
      // AI 失败就用本地结果, 不打断流程
      console.warn('AI 分类失败, 使用本地规则:', err.message);
    }
  }

  editingId = null;
  document.getElementById('modal-title').textContent =
    aiUsed ? '识别结果(AI 已分类,请确认)' : '识别结果(请确认)';
  document.getElementById('m-heard').style.display = 'block';
  document.getElementById('m-heard-text').textContent = cleaned;
  document.getElementById('m-amount').value = amount || '';
  document.getElementById('m-cat').value = cat;
  document.getElementById('m-note').value = note;
  document.getElementById('m-delete').style.display = 'none';
  document.getElementById('modal').classList.add('show');
  if (!amount) setTimeout(() => document.getElementById('m-amount').focus(), 200);
  document.getElementById('hint').textContent = '按住"按住说话"记账,点"查一查"查询';
}

function addRecord(r) {
  r.id = r.id || ('r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
  records.unshift(r);
  save(); render();
}

function updateRecord(id, patch) {
  const i = records.findIndex(r => r.id === id);
  if (i >= 0) {
    const old = records[i];
    Object.assign(records[i], patch);
    if (patch.cat && patch.cat !== old.cat && old.text) learnKeyword(old.text, patch.cat);
    save(); render();
  }
}

function learnKeyword(text, cat) {
  const cleaned = text.replace(/[\d零一二两三四五六七八九十百千万块元钱毛角的了吗呢啊]/g, '');
  if (cleaned.length >= 2) learned[cleaned.slice(0, 4)] = cat;
}

// ============ 周期工具 ============
function getPeriodRange(period, offset) {
  const now = new Date();
  let start, end, label;

  if (period === 'day') {
    const d = new Date(now);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + offset);
    start = d.getTime();
    end = start + 86400000;
    if (offset === 0) label = '今天';
    else if (offset === -1) label = '昨天';
    else if (offset === -2) label = '前天';
    else label = `${d.getMonth()+1}月${d.getDate()}日`;
  }
  else if (period === 'week') {
    const d = new Date(now);
    d.setHours(0,0,0,0);
    const dow = d.getDay() === 0 ? 6 : d.getDay() - 1;
    d.setDate(d.getDate() - dow + offset * 7);
    start = d.getTime();
    end = start + 7 * 86400000;
    if (offset === 0) label = '本周';
    else if (offset === -1) label = '上周';
    else {
      const e = new Date(end - 1);
      label = `${d.getMonth()+1}/${d.getDate()} - ${e.getMonth()+1}/${e.getDate()}`;
    }
  }
  else if (period === 'month') {
    const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    start = d.getTime();
    end = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
    if (offset === 0) label = '本月';
    else if (offset === -1) label = '上月';
    else label = `${d.getFullYear()}年${d.getMonth()+1}月`;
  }
  else if (period === 'quarter') {
    const curQ = Math.floor(now.getMonth() / 3);
    const baseMonth = curQ * 3 + offset * 3;
    const d = new Date(now.getFullYear(), baseMonth, 1);
    start = d.getTime();
    end = new Date(d.getFullYear(), baseMonth + 3, 1).getTime();
    const q = Math.floor(d.getMonth() / 3) + 1;
    if (offset === 0) label = '本季度';
    else label = `${d.getFullYear()}年第${q}季度`;
  }
  else if (period === 'year') {
    const d = new Date(now.getFullYear() + offset, 0, 1);
    start = d.getTime();
    end = new Date(d.getFullYear() + 1, 0, 1).getTime();
    if (offset === 0) label = '今年';
    else if (offset === -1) label = '去年';
    else label = `${d.getFullYear()}年`;
  }
  return { start, end, label };
}

function periodName(period) {
  return {day:'天', week:'周', month:'月', quarter:'季度', year:'年'}[period];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDayLabel(d) {
  const today = new Date();
  const diff = Math.floor((today.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
  if (diff === 0) return '今天 ' + d.toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'});
  if (diff === 1) return '昨天 ' + d.toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'});
  return d.toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'short'});
}

function render() {
  const now = new Date();
  const ym = now.getFullYear()*100 + now.getMonth();
  const todayStr = now.toDateString();
  let monthSum = 0, todaySum = 0;
  records.forEach(r => {
    const d = new Date(r.ts);
    if (d.getFullYear()*100 + d.getMonth() === ym) monthSum += r.amount;
    if (d.toDateString() === todayStr) todaySum += r.amount;
  });
  document.getElementById('month-total').textContent = '¥ ' + monthSum.toFixed(2);
  document.getElementById('today-total').textContent = '¥' + todaySum.toFixed(0);
  document.getElementById('record-count').textContent = records.length;

  const listEl = document.getElementById('list-content');
  if (records.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="icon">📒</div>还没有账目<br>按下方按钮说一句试试</div>';
  } else {
    const groups = {};
    records.forEach(r => {
      const d = new Date(r.ts);
      const key = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    const keys = Object.keys(groups).sort().reverse();
    listEl.innerHTML = keys.map(key => {
      const items = groups[key];

          const c = CAT_COLORS[r.cat] || CAT_COLORS['其他'];

let curPeriod = 'day';
let curOffset = 0;

function renderStat() {
  document.getElementById('period-prev').disabled = false;
  document.getElementById('period-next').disabled = curOffset >= 0;

  const { start, end, label } = getPeriodRange(curPeriod, curOffset);
  document.getElementById('period-label').textContent = label;

  const recs = records.filter(r => r.ts >= start && r.ts < end);
  const sum = recs.reduce((s, r) => s + r.amount, 0);

  const prev = getPeriodRange(curPeriod, curOffset - 1);
  const prevRecs = records.filter(r => r.ts >= prev.start && r.ts < prev.end);
  const prevSum = prevRecs.reduce((s, r) => s + r.amount, 0);
  let deltaHtml = '';
  if (prevSum > 0) {
    const diff = sum - prevSum;
    const pct = Math.abs(diff / prevSum * 100).toFixed(0);
    if (diff > 0) deltaHtml = `<p class="delta up">↑ 比上${periodName(curPeriod)}多 ¥${diff.toFixed(2)} (${pct}%)</p>`;
    else if (diff < 0) deltaHtml = `<p class="delta down">↓ 比上${periodName(curPeriod)}少 ¥${(-diff).toFixed(2)} (${pct}%)</p>`;
    else deltaHtml = `<p class="delta">和上${periodName(curPeriod)}持平</p>`;
  } else if (sum > 0) {
    deltaHtml = `<p class="delta">上${periodName(curPeriod)}没有记录</p>`;
  }

  const el = document.getElementById('stat-content');
  if (recs.length === 0) {
    el.innerHTML = `
      <div class="stat-card">
        <p class="name">${label}总支出</p>
        <p class="val">¥ 0.00</p>
      </div>
      <div class="empty"><div class="icon">📊</div>${label}没有记账</div>
    `;
    return;
  }

  const days = new Set(recs.map(r => new Date(r.ts).toDateString())).size;
  const avg = days > 0 ? sum / days : 0;

  const catMap = {};
  recs.forEach(r => { catMap[r.cat] = (catMap[r.cat] || 0) + r.amount; });
  const cats = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
  const max = cats[0][1];

  const groups = {};
  recs.slice().sort((a,b) => b.ts - a.ts).forEach(r => {
    const d = new Date(r.ts);
    const key = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });

  el.innerHTML = `
    <div class="stat-card">
      <p class="name">${label}总支出</p>
      <p class="val">¥ ${sum.toFixed(2)}</p>
      ${deltaHtml}
    </div>
    <div class="stat-card-row">
      <div class="stat-card"><p class="name">日均</p><p class="val">¥ ${avg.toFixed(0)}</p></div>
      <div class="stat-card"><p class="name">笔数</p><p class="val">${recs.length}</p></div>
    </div>
    <h3 class="section-title">分类支出</h3>
    ${cats.map(([cat, val]) => {
      const c = CAT_COLORS[cat] || CAT_COLORS['其他'];
      const pct = (val / sum * 100).toFixed(0);
      const w = (val / max * 100);
      return `<div class="cat-stat-row">
        <span class="cat-tag" style="background:${c.bg};color:${c.fg}; min-width: 56px; text-align:center;">${cat}</span>
        <div class="cat-stat-bar"><div style="width:${w}%; background:${c.fg};"></div></div>
        <span style="font-size:14px; font-weight:500; min-width: 80px; text-align:right;">¥${val.toFixed(2)} <span style="color:#888780; font-size:11px;">${pct}%</span></span>
      </div>`;
    }).join('')}
    <h3 class="section-title">明细</h3>
    ${Object.keys(groups).map(key => {
      const items = groups[key];
      const ds = new Date(items[0].ts);
      const sm = items.reduce((s,r) => s+r.amount, 0);
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#888780;padding:4px 0;border-bottom:0.5px solid #f0ede5;">
          <span>${formatDayLabel(ds)}</span>
          <span>¥${sm.toFixed(2)}</span>
        </div>
        ${items.map(r => {
          const c = CAT_COLORS[r.cat] || CAT_COLORS['其他'];
          const display = r.note || r.text || r.cat;
          return `<div class="item" style="padding:10px 0;border-bottom:0.5px solid #f7f5f0;" onclick="openEditModal('${r.id}')">
            <span class="cat-tag" style="background:${c.bg};color:${c.fg};">${r.cat}</span>
            <div class="item-text"><p class="raw">${escapeHtml(display)}</p></div>
            <span class="item-amount" style="font-size:15px;">¥${r.amount.toFixed(2)}</span>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  `;
}

// ============ 语音查询解析 ============
function parseQuery(text) {
  const t = text.replace(/\s/g, '');
  const now = new Date();
  let start, end, label;
  let cat = classify(t);
  if (cat === '其他') cat = null;

  let type = 'total';
  if (/明细|什么|哪些|花了啥|有什么/.test(t)) type = 'detail';

  let matched = false;
  let m;

  m = t.match(/最近([零一二两三四五六七八九十\d]+)(天|日|周|个月|月)/);
  if (m) {
    const numStr = m[1];
    const num = /\d/.test(numStr) ? parseInt(numStr) : parseChineseNumber(numStr);
    const unit = m[2];
    const e = new Date(now);
    e.setHours(0,0,0,0);
    e.setDate(e.getDate() + 1);
    end = e.getTime();
    const s = new Date(e);
    if (unit === '天' || unit === '日') s.setDate(s.getDate() - num);
    else if (unit === '周') s.setDate(s.getDate() - num * 7);
    else s.setMonth(s.getMonth() - num);
    start = s.getTime();
    label = `最近${num}${unit === '日' ? '天' : unit}`;
    matched = true;
  }

  if (!matched && /今天|今日/.test(t)) {
    const r = getPeriodRange('day', 0); start = r.start; end = r.end; label = '今天'; matched = true;
  }
  if (!matched && /昨天|昨日/.test(t)) {
    const r = getPeriodRange('day', -1); start = r.start; end = r.end; label = '昨天'; matched = true;
  }
  if (!matched && /前天/.test(t)) {
    const r = getPeriodRange('day', -2); start = r.start; end = r.end; label = '前天'; matched = true;
  }
  if (!matched && /本周|这周|这个礼拜|这礼拜|本礼拜/.test(t)) {
    const r = getPeriodRange('week', 0); start = r.start; end = r.end; label = '本周'; matched = true;
  }
  if (!matched && /上周|上个礼拜|上礼拜/.test(t)) {
    const r = getPeriodRange('week', -1); start = r.start; end = r.end; label = '上周'; matched = true;
  }
  if (!matched && /本月|这个月|这月/.test(t)) {
    const r = getPeriodRange('month', 0); start = r.start; end = r.end; label = '本月'; matched = true;
  }
  if (!matched && /上月|上个月/.test(t)) {
    const r = getPeriodRange('month', -1); start = r.start; end = r.end; label = '上月'; matched = true;
  }
  if (!matched) {
    m = t.match(/([零一二两三四五六七八九十\d]+)月份?/);
    if (m) {
      const numStr = m[1];
      const monthNum = /\d/.test(numStr) ? parseInt(numStr) : parseChineseNumber(numStr);
      if (monthNum >= 1 && monthNum <= 12) {
        let year = now.getFullYear();
        if (monthNum > now.getMonth() + 1) year -= 1;
        const d = new Date(year, monthNum - 1, 1);
        start = d.getTime();
        end = new Date(year, monthNum, 1).getTime();
        label = `${year}年${monthNum}月`;
        matched = true;
      }
    }
  }
  if (!matched && /本季|这季|这个季度|本季度/.test(t)) {
    const r = getPeriodRange('quarter', 0); start = r.start; end = r.end; label = '本季度'; matched = true;
  }
  if (!matched && /上季|上个季度|上季度/.test(t)) {
    const r = getPeriodRange('quarter', -1); start = r.start; end = r.end; label = '上季度'; matched = true;
  }
  if (!matched && /今年|本年/.test(t)) {
    const r = getPeriodRange('year', 0); start = r.start; end = r.end; label = '今年'; matched = true;
  }
  if (!matched && /去年|上一年/.test(t)) {
    const r = getPeriodRange('year', -1); start = r.start; end = r.end; label = '去年'; matched = true;
  }
  if (!matched) {
    const r = getPeriodRange('month', 0);
    start = r.start; end = r.end; label = '本月';
  }

  return { start, end, label, cat, type, matched };
}

// 把 AI 返回的 {period, offset, days, cat, type} 转成 {start, end, label, cat, type}
function aiQueryToRange(ai) {
  let start, end, label;
  const now = new Date();

  if (ai.period === 'recent' && ai.days && ai.days > 0) {
    const e = new Date(now);
    e.setHours(0,0,0,0);
    e.setDate(e.getDate() + 1);
    end = e.getTime();
    const s = new Date(e);
    s.setDate(s.getDate() - ai.days);
    start = s.getTime();
    label = `最近${ai.days}天`;
  } else if (ai.period === 'specific_month' && ai.offset >= 1 && ai.offset <= 12) {
    let year = now.getFullYear();
    if (ai.offset > now.getMonth() + 1) year -= 1;
    const d = new Date(year, ai.offset - 1, 1);
    start = d.getTime();
    end = new Date(year, ai.offset, 1).getTime();
    label = `${year}年${ai.offset}月`;
  } else if (['day','week','month','quarter','year'].includes(ai.period)) {
    const r = getPeriodRange(ai.period, ai.offset || 0);
    start = r.start; end = r.end; label = r.label;
  } else {
    return null;
  }
  return { start, end, label, cat: ai.cat || null, type: ai.type === 'detail' ? 'detail' : 'total' };
}

async function handleQueryText(text) {
  const cleaned = text.replace(/[。,!?、\s]+$/g, '').trim();

  // 优先用 AI 解析(更准、覆盖更多说法)
  let q = null;
  document.getElementById('hint').textContent = '正在理解问题...';
  try {
    const ai = await callAI('query', cleaned);
    q = aiQueryToRange(ai);
  } catch (err) {
    console.warn('AI 查询解析失败, 回退到本地规则:', err.message);
  }
  // AI 失败或返回不合法 → 本地规则兜底
  if (!q) q = parseQuery(cleaned);

  let recs = records.filter(r => r.ts >= q.start && r.ts < q.end);
  if (q.cat) recs = recs.filter(r => r.cat === q.cat);

  document.getElementById('ans-heard-text').textContent = cleaned;
  const titleParts = [q.label];
  if (q.cat) titleParts.push(q.cat);
  document.getElementById('ans-title').textContent = titleParts.join(' · ') + (q.type === 'detail' ? ' 明细' : ' 支出');

  const sum = recs.reduce((s, r) => s + r.amount, 0);
  const ansEl = document.getElementById('ans-content');

  if (recs.length === 0) {
    ansEl.innerHTML = `
      <div class="answer-big">
        <p class="a-label">${q.label}${q.cat ? ' ' + q.cat : ''}</p>
        <p class="a-val">¥ 0</p>
        <p class="a-sub">没有记录</p>
      </div>
    `;
  } else if (q.type === 'detail') {
    const sorted = recs.slice().sort((a,b) => b.ts - a.ts);
    ansEl.innerHTML = `
      <div class="answer-big">
        <p class="a-label">共 ${recs.length} 笔,合计</p>
        <p class="a-val">¥ ${sum.toFixed(2)}</p>
      </div>
      <div class="answer-list">
        ${sorted.map(r => {
          const c = CAT_COLORS[r.cat] || CAT_COLORS['其他'];
          const d = new Date(r.ts);
          const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
          const display = r.note || r.text || r.cat;
          return `<div class="item" style="padding:10px 0;">
            <span class="cat-tag" style="background:${c.bg};color:${c.fg};">${r.cat}</span>
            <div class="item-text">
              <p class="raw">${escapeHtml(display)}</p>
              <p class="time">${dateStr}</p>
            </div>
            <span class="item-amount" style="font-size:15px;">¥${r.amount.toFixed(2)}</span>
          </div>`;
        }).join('')}
      </div>
    `;
  } else {
    const catMap = {};
    recs.forEach(r => { catMap[r.cat] = (catMap[r.cat] || 0) + r.amount; });
    const cats = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
    ansEl.innerHTML = `
      <div class="answer-big">
        <p class="a-label">${q.label}${q.cat ? ' ' + q.cat : ''}花了</p>
        <p class="a-val">¥ ${sum.toFixed(2)}</p>
        <p class="a-sub">共 ${recs.length} 笔</p>
      </div>
      ${q.cat ? '' : `
        <h3 class="section-title" style="margin-top:0;">分类</h3>
        ${cats.slice(0, 5).map(([cat, val]) => {
          const c = CAT_COLORS[cat] || CAT_COLORS['其他'];
          const pct = (val / sum * 100).toFixed(0);
          return `<div class="cat-stat-row">
            <span class="cat-tag" style="background:${c.bg};color:${c.fg}; min-width: 56px; text-align:center;">${cat}</span>
            <div class="cat-stat-bar"><div style="width:${pct}%; background:${c.fg};"></div></div>
            <span style="font-size:14px; min-width: 80px; text-align:right;">¥${val.toFixed(2)} <span style="color:#888780; font-size:11px;">${pct}%</span></span>
          </div>`;
        }).join('')}
      `}
    `;
  }

  document.getElementById('answer-modal').classList.add('show');
  document.getElementById('hint').textContent = '按住"按住说话"记账,点"查一查"查询';
}

function closeAnswerModal() {
  document.getElementById('answer-modal').classList.remove('show');
}

function exportData() {
  if (records.length === 0) { alert('还没有记录'); return; }
  const header = ['日期','时间','分类','金额','说话内容','备注'];
  const rows = records.slice().sort((a,b) => a.ts - b.ts).map(r => {
    const d = new Date(r.ts);
    return [
      d.toLocaleDateString('zh-CN'), d.toLocaleTimeString('zh-CN'),
      r.cat, r.amount.toFixed(2),
      (r.text || '').replace(/,/g, ' '),
      (r.note || '').replace(/,/g, ' ')
    ];
  });
  const csv = '\uFEFF' + [header, ...rows].map(row => row.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `记账_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function confirmClear() {
  if (records.length === 0) return;
  if (confirm(`确定清空全部 ${records.length} 条记录吗?\n建议先点"导出 Excel"备份。`)) {
    if (confirm('真的要清空吗?清空后无法恢复。')) {
      records = []; save(); render();
    }
  }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('view-list').style.display = tab === 'list' ? 'block' : 'none';
    document.getElementById('view-stat').style.display = tab === 'stat' ? 'block' : 'none';
  });
});

document.querySelectorAll('.stat-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curPeriod = btn.dataset.period;
    curOffset = 0;
    renderStat();
  });
});

document.getElementById('period-prev').addEventListener('click', () => {
  curOffset -= 1; renderStat();
});
document.getElementById('period-next').addEventListener('click', () => {
  if (curOffset < 0) { curOffset += 1; renderStat(); }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('answer-modal').addEventListener('click', e => {
  if (e.target.id === 'answer-modal') closeAnswerModal();
});

setupMicButton(
  document.getElementById('mic-btn'),
  document.getElementById('btn-text'),
  document.getElementById('hint'),
  'record'
);
setupMicButton(
  document.getElementById('query-btn'),
  null,
  document.getElementById('hint'),
  'query'
);

render();
</script>
